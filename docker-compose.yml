version: "2.27.0"

services:
  zukudb:
    image: postgres:alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${UserName}
      - POSTGRES_PASSWORD=${Password}
      - POSTGRES_DB=${DBName}

    volumes:
      - zuko-data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - .:/usr/src/app
    command: air ./cmd/main.go -b 0.0.0.0

volumes:
  zuko-data:
