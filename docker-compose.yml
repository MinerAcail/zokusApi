services:
  zukudb:
    image: postgres:alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${UserName}
      - POSTGRES_PASSWORD=${Password}
      - POSTGRES_DB=${DBName}
    volumes:
      - zuko-data:/var/lib/postgresql/data


      
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"


  api:
    build: .
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - .:/usr/src/app
    environment:
    - Port=${Port}
    - UserName=${UserName}
    - Password=${Password}
    - DBName=${DBName}
    - Host=zukudb
    command: air ./cmd/main.go -b 0.0.0.0

volumes:
  zuko-data:
